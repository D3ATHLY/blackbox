name: linkpool
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dogrula
        run: python linkpool/linkpool.py verify
      - name: Yayin dosyalarini uret
        run: python linkpool/publish.py
      - name: Commit
        run: |
          git config user.name "linkpool-bot"
          git config user.email "linkpool@users.noreply.github.com"
          git add linkpool/verify-report.json linkpool/public/links || true
          git diff --cached --quiet || git commit -m "linkpool: hourly verify"
          git push
