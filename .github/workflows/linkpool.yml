name: linkpool
on:
  schedule:
    - cron: "17 * * * *"      # saatlik dogrulama + yayin
  workflow_dispatch: {}
  push:
    paths:
      - "linkpool/links/**"
      - "linkpool/base/**"
      - "linkpool/linkpool.py"
      - "linkpool/publish.py"
      - "linkpool/make_catalog_update.py"
      - "linkpool/check_expiry.py"
permissions:
  contents: write
  issues: write
concurrency:
  group: linkpool
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 1) Linkleri dogrula
        run: python linkpool/linkpool.py verify

      - name: 2) Yayin JSON'u uret
        run: python linkpool/publish.py

      - name: 3) catalog-update.json uret
        run: python linkpool/make_catalog_update.py

      - name: 3b) Uretilen dosyalari guvene al
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp linkpool/verify-report.json "$RUNNER_TEMP/out/"
          rm -rf "$RUNNER_TEMP/out/public"
          cp -r linkpool/public "$RUNNER_TEMP/out/public"
          cp linkpool/public/catalog-update.json "$RUNNER_TEMP/catalog-update.json"

      # Uretilen dosyalar her seferinde bastan yazildigi icin rebase/merge
      # catismasi olmaz: en son origin/main uzerine kopyalanip commit edilir.
      - name: 4) main'e yaz (catismasiz, 3 deneme)
        run: |
          set -e
          git config user.name "linkpool-bot"
          git config user.email "linkpool@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/out/verify-report.json" linkpool/verify-report.json
            rm -rf linkpool/public
            cp -r "$RUNNER_TEMP/out/public" linkpool/public
            git add -A linkpool/verify-report.json linkpool/public
            if git diff --cached --quiet; then
              echo "degisiklik yok"
              break
            fi
            git commit -m "linkpool: hourly verify"
            if git push origin HEAD:main; then
              echo "main guncellendi"
              break
            fi
            echo "push yarisi, tekrar deneniyor ($attempt)"
            sleep 5
          done

      - name: 5) catalog dalina yaz (catismasiz, 3 deneme)
        run: |
          set -e
          git config user.name "linkpool-bot"
          git config user.email "linkpool@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin catalog >/dev/null 2>&1; then
            BASE_REF=catalog
          else
            BASE_REF=main
          fi
          for attempt in 1 2 3; do
            git fetch origin "$BASE_REF"
            git reset --hard "origin/$BASE_REF"
            # reset, linkpool/public icindeki dosyayi eski haline dondurur:
            # bu yuzden 3b adiminda alinan taze kopya kullanilir.
            cp "$RUNNER_TEMP/catalog-update.json" ./catalog-update.json
            git add catalog-update.json
            if git diff --cached --quiet; then
              echo "degisiklik yok, yazilmadi"
              break
            fi
            git commit -m "catalog: hourly link refresh ($(date -u +%Y-%m-%dT%H:%MZ))"
            if git push origin HEAD:catalog; then
              echo "catalog guncellendi"
              break
            fi
            echo "push yarisi, tekrar deneniyor ($attempt)"
            sleep 5
          done

      - name: 6) Suresi yaklasan linkleri bildir
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python linkpool/check_expiry.py
          TITLE_FILE="$RUNNER_TEMP/refresh-needed.txt"
          BODY_FILE="$RUNNER_TEMP/refresh-body.md"
          [ -f "$TITLE_FILE" ] || exit 0
          TITLE="Link yenile: $(cat "$TITLE_FILE")"
          OPEN=$(gh issue list --state open --search "Link yenile in:title" --json number --jq 'length' 2>/dev/null)
          if [ "$OPEN" = "0" ] || [ -z "$OPEN" ]; then
            gh issue create --title "$TITLE" --body-file "$BODY_FILE" || echo "issue acilamadi (yetki?)"
          else
            echo "acik bir 'Link yenile' issue zaten var ($OPEN)"
          fi
